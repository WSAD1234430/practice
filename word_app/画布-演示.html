//# sourceURL=flat2code-runtime.js</script><script data-mb-proto-addon>
(function () {
  var WORDS = ['apple','banana','cat','dog','egg','fish','green','house','ice','juice'];
  var listLayer = document.getElementById('mb-list-layer');
  var bigWord   = document.querySelector('#mb-hr71q5 span');
  var items     = listLayer.querySelectorAll('.mb-wl-item');
  var cur = -1;

  function open(el){ el.style.display = 'block'; }
  function shut(el){ el.style.display = 'none'; }

  function render(){
    if (bigWord) bigWord.textContent = cur < 0 ? '这里放单词' : WORDS[cur];
    for (var i = 0; i < items.length; i++){
      items[i].className = 'mb-wl-item' + (i === cur ? ' mb-wl-item-active' : '');
    }
  }

  function gotoWord(idx){
    if (idx < 0 || idx >= WORDS.length) return;
    cur = idx;
    render();
    shut(listLayer);
  }

  function step(delta){
    if (cur < 0 && delta < 0) return;
    var next = cur + delta;
    if (next < 0) next = 0;
    if (next > WORDS.length - 1) next = WORDS.length - 1;
    if (next === cur) return;
    cur = next;
    render();
  }

  window.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (!t.closest('#mb-list-layer,#mb-btn-list,#mb-yjb72j,#mb-5m55rz')) return;
    e.stopPropagation();

    if (t.closest('#mb-btn-list')) { open(listLayer); return; }
    if (t.closest('#mb-list-close') || t.id === 'mb-list-mask') { shut(listLayer); return; }
    if (t.closest('#mb-yjb72j')) { step(-1); return; }
    if (t.closest('#mb-5m55rz')) { step(1); return; }
    var item = t.closest('.mb-wl-item');
    if (item) { gotoWord(Number(item.getAttribute('data-idx'))); }
  }, true);

  var page = document.getElementById('mb-f4qdw2');
  if (page) {
    var wasHidden = page.hasAttribute('hidden');
    new MutationObserver(function () {
      var nowHidden = page.hasAttribute('hidden');
      if (nowHidden !== wasHidden) {
        wasHidden = nowHidden;
        if (nowHidden) { shut(listLayer); }
      }
    }).observe(page, { attributes: true, attributeFilter: ['hidden'] });
  }
  render();
})();
</script></body></html>
